[package]
name = "pocketreel-cli"
description = "Command-line interface and development bridge for Pocket Reel."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[[bin]]
name = "pocketreel"
path = "src/main.rs"

[dependencies]
pocketreel-engine = { path = "../engine" }
