[workspace]
resolver = "2"
members = ["crates/engine", "crates/cli", "app/src-tauri"]
default-members = ["crates/engine", "crates/cli", "app/src-tauri"]

[workspace.package]
version = "1.3.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/mananbharti/pocket-reel"
authors = ["Manan Bharti"]
rust-version = "1.77"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
base64 = "0.22"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

[profile.dev.package."*"]
opt-level = 2
