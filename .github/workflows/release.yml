name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish to (for example v1.0.0). Leave empty to only build."
        type: string
        default: ""

permissions:
  contents: write

env:
  FFMPEG_SERIES: n8.1

jobs:
  linux:
    name: Linux (.deb, AppImage)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev patchelf file
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - name: Bundle FFmpeg
        run: scripts/fetch-ffmpeg.sh linux64
      - name: Build
        working-directory: app
        run: |
          npm ci
          npx tauri build --bundles deb,appimage
      - name: Smoke test the bundled app's engine
        run: |
          ./app/src-tauri/resources/ffmpeg/ffmpeg -v error -f lavfi -i testsrc2=size=320x240:duration=2 -f lavfi -i sine=d=2 -c:v libx264 -c:a aac s.mp4
          POCKETREEL_FFMPEG=$PWD/app/src-tauri/resources/ffmpeg/ffmpeg POCKETREEL_FFPROBE=$PWD/app/src-tauri/resources/ffmpeg/ffprobe cargo run --release -p pocketreel-cli -- convert s.mp4 -p classic-avi -o out
          dpkg-deb -c target/release/bundle/deb/*.deb | grep -E 'ffmpeg|ffprobe|pocket-reel'
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage

  windows:
    name: Windows (installer, MSI)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - name: Bundle FFmpeg
        shell: bash
        run: scripts/fetch-ffmpeg.sh win64
      - name: Build
        working-directory: app
        run: |
          npm ci
          npx tauri build --bundles nsis,msi
      - name: Smoke test the bundled engine
        shell: bash
        run: |
          F=app/src-tauri/resources/ffmpeg
          $F/ffmpeg.exe -v error -f lavfi -i testsrc2=size=320x240:duration=2 -f lavfi -i sine=d=2 -c:v libx264 -c:a aac s.mp4
          POCKETREEL_FFMPEG=$F/ffmpeg.exe POCKETREEL_FFPROBE=$F/ffprobe.exe cargo run --release -p pocketreel-cli -- convert s.mp4 -p classic-avi -o out
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi

  android:
    name: Android (APK)
    runs-on: ubuntu-24.04
    env:
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - name: Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" "platforms;android-35" "build-tools;35.0.0" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - name: Cache FFmpeg for Android
        id: ffcache
        uses: actions/cache@v4
        with:
          path: android-ffmpeg
          key: android-ffmpeg-${{ hashFiles('scripts/build-ffmpeg-android.sh') }}-${{ env.NDK_VERSION }}
      - name: Build FFmpeg for Android
        if: steps.ffcache.outputs.cache-hit != 'true'
        run: scripts/build-ffmpeg-android.sh android-ffmpeg arm64-v8a x86_64
      - name: Generate and patch the Android project
        working-directory: app
        run: |
          npm ci
          npx tauri android init --ci
          python3 ../scripts/patch-android.py ../android-ffmpeg
      - name: Build APK
        working-directory: app
        run: npx tauri android build --apk --ci --target aarch64 --target x86_64
      - name: Sign APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -e
          apk=$(find app/src-tauri/gen/android -name '*universal*release*.apk' | head -1)
          bt="$ANDROID_HOME/build-tools/35.0.0"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.jks
            pass="$KEYSTORE_PASSWORD"
          else
            echo "::warning::No ANDROID_KEYSTORE secret; signing with a one-off key."
            pass=ephemeral-$(date +%s)
            keytool -genkeypair -keystore release.jks -storepass "$pass" -keypass "$pass" -alias pocketreel \
              -keyalg RSA -keysize 4096 -validity 10000 -dname "CN=Pocket Reel" >/dev/null
          fi
          "$bt/zipalign" -f -p 4 "$apk" aligned.apk
          "$bt/apksigner" sign --ks release.jks --ks-pass "pass:$pass" --out PocketReel-android.apk aligned.apk
          "$bt/apksigner" verify --print-certs PocketReel-android.apk | head -3
          rm -f release.jks
          unzip -l PocketReel-android.apk | grep -E 'lib/.*/lib(ffmpeg|ffprobe|pocket_reel_lib)\.so'
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: PocketReel-android.apk

  android-test:
    name: Android emulator test
    needs: android
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: android }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install, convert a video in the app, check the output
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          # Plain AOSP image: Google Play services on fresh emulators often
          # crashes during boot-time updates and takes apps down with it.
          target: default
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          script: python3 scripts/android-smoke.py PocketReel-android.apk android-shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-screenshots
          path: android-shots

  publish:
    name: Publish Windows and Linux
    needs: [linux, windows]
    if: github.ref_type == 'tag' || inputs.tag != ''
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: "{linux,windows}", path: dist }
      - name: Name files by platform
        run: |
          mkdir release
          cp dist/linux/deb/*.deb release/PocketReel-linux-amd64.deb
          cp dist/linux/appimage/*.AppImage release/PocketReel-linux-x86_64.AppImage
          cp dist/windows/nsis/*.exe release/PocketReel-windows-x64-setup.exe
          cp dist/windows/msi/*.msi release/PocketReel-windows-x64.msi
          (cd release && sha256sum * > SHA256SUMS.txt)
          ls -la release
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Pocket Reel ${{ env.TAG }}
          files: release/*
          body: |
            Put any video on your MP3 player: add videos, press Convert, copy them to the player.

            | Platform | Download |
            | --- | --- |
            | Windows 10/11 | `PocketReel-windows-x64-setup.exe` (or the `.msi`) |
            | Linux | `PocketReel-linux-x86_64.AppImage` (or the `.deb`) |
            | Android 8+ | `PocketReel-android.apk` is added to this release once its device test passes |

            Checksums are in `SHA256SUMS.txt`. The Windows installer is not code-signed yet, so SmartScreen may ask you to confirm.

  publish-android:
    name: Attach Android APK
    needs: [android, android-test, publish]
    if: github.ref_type == 'tag' || inputs.tag != ''
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with: { name: android }
      - name: Upload APK and update checksums
        run: |
          gh release download "$TAG" -p SHA256SUMS.txt --clobber
          grep -v 'PocketReel-android.apk' SHA256SUMS.txt > sums.txt || true
          sha256sum PocketReel-android.apk >> sums.txt
          mv sums.txt SHA256SUMS.txt
          gh release upload "$TAG" PocketReel-android.apk SHA256SUMS.txt --clobber
